<body>


<div class="main">
<div class='main_header'>
	<h1>Nikita's Home</h1>
</div>
<div class="peek_guy" aria-hidden="true">
	<svg viewBox="0 0 150 75" role="img">
		<g class="peek_guy_body">
			<path class="peek_guy_brow" d="M19 20 C35 5 55 5 68 13" />
			<path class="peek_guy_brow right" d="M93 15 C105 8 119 8 128 11" />
			<path class="peek_guy_eye" d="M35 40 C31 25 43 15 56 17 C74 21 80 42 66 57 C52 72 31 61 30 45 C29 36 33 28 38 29" />
			<path class="peek_guy_eye right" d="M97 39 C94 28 102 22 113 24 C127 27 132 43 122 54 C111 66 96 58 95 44 C94 36 98 30 102 31" />
			<path class="peek_guy_pupil" data-eye="left" data-center-x="50" data-center-y="44" d="M46 45 C45 39 50 36 53 41 C56 47 51 52 47 50 C45 49 44 47 46 45" />
			<path class="peek_guy_pupil right" data-eye="right" data-center-x="110" data-center-y="43" d="M106 43 C106 38 110 36 113 40 C116 45 112 50 108 48 C106 47 105 45 106 43" />
			<circle class="peek_guy_highlight" data-eye="left" cx="50" cy="42" r="1.4" />
			<circle class="peek_guy_highlight right" data-eye="right" cx="110" cy="41" r="1.3" />
		</g>
	</svg>
</div>

<script>
  (function(){
    var peeker = document.querySelector('.peek_guy svg');
    if (!peeker) return;

    var pupils = peeker.querySelectorAll('.peek_guy_pupil');
    var highlights = peeker.querySelectorAll('.peek_guy_highlight');
    var bounds = { left: { x: 50, y: 44 }, right: { x: 110, y: 43 } };
    var limitX = 5;
    var limitY = 4;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function moveEyes(event) {
      var rect = peeker.getBoundingClientRect();
      var scaleX = 150 / rect.width;
      var scaleY = 75 / rect.height;
      var x = (event.clientX - rect.left) * scaleX;
      var y = (event.clientY - rect.top) * scaleY;

      Array.prototype.forEach.call(pupils, function(pupil) {
        var eye = bounds[pupil.getAttribute('data-eye')];
        var dx = clamp((x - eye.x) / 10, -limitX, limitX);
        var dy = clamp((y - eye.y) / 10, -limitY, limitY);
        pupil.setAttribute('transform', 'translate(' + dx + ' ' + dy + ')');
      });

      Array.prototype.forEach.call(highlights, function(highlight) {
        var eye = bounds[highlight.getAttribute('data-eye')];
        var dx = clamp((x - eye.x) / 10, -limitX, limitX);
        var dy = clamp((y - eye.y) / 10, -limitY, limitY);
        highlight.setAttribute('transform', 'translate(' + dx + ' ' + dy + ')');
      });
    }

    document.addEventListener('mousemove', moveEyes);
  })();

  (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
  (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
  m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
  })(window,document,'script','//www.google-analytics.com/analytics.js','ga');

  ga('create', 'UA-37427029-1', 'auto');
  ga('send', 'pageview');

</script>
</body>
